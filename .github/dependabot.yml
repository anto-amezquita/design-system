version: 2
updates:
  # Routine updates, grouped into a few PRs a month. Monthly, not weekly:
  # every dependency PR re-snapshots all Storybook stories in Chromatic
  # (a lockfile change defeats TurboSnap), and weekly runs used up the
  # free monthly snapshot limit. Security updates are unaffected and still
  # open as soon as an advisory is published. The cooldown waits 7 days
  # before proposing a new release (security updates skip it), so a hijacked
  # version is usually caught and pulled before it reaches this repo.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"

  # Keeps action versions current, including SHA-pinned ones.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

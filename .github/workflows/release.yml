name: Release

# On every push to main: if there are pending changesets, opens/updates a
# "Version Packages" PR (bumps package.json, writes CHANGELOG.md). If that PR
# was just merged (no changesets pending, but the version differs from what's
# on npm), publishes to npm instead. Never both in the same run.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Trusted publishing needs a recent npm CLI (11.5.1+) to detect and use
      # the OIDC token — the version bundled with actions/setup-node may lag.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Create Release Pull Request or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fires only when this run actually published (not on the "Version
      # Packages" PR-open runs). Mints one token scoped to the two repos that
      # take each release as a PR: the portfolio and the docs site
      # (design-system-site's decisions/0001, item 3). Same GitHub App as
      # self-heal-stale-artifacts.yml's, installed on both since 2026-10-05.
      # Each repo's own sync-design-system.yml picks the dispatch up.
      - name: Mint a token scoped to the sites that sync releases
        if: steps.changesets.outputs.published == 'true'
        id: sites-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SELF_HEAL_APP_CLIENT_ID }}
          private-key: ${{ secrets.SELF_HEAL_APP_PRIVATE_KEY }}
          owner: anto-amezquita
          repositories: portfolio,design-system-site

      # Tries every repo, so one failing doesn't keep the release from the
      # other; the step goes red at the end if any dispatch failed.
      - name: Notify the sites of the new release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.sites-token.outputs.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          failed=""
          for repo in portfolio design-system-site; do
            if gh api "repos/anto-amezquita/$repo/dispatches" \
                -f event_type=design-system-released \
                -f "client_payload[version]=$VERSION"; then
              echo "Dispatched design-system-released ($VERSION) to anto-amezquita/$repo"
            else
              echo "::error::Dispatch to anto-amezquita/$repo failed"
              failed="$failed $repo"
            fi
          done
          [ -z "$failed" ] || exit 1

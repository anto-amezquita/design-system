name: Release

# On every push to main: if there are pending changesets, opens/updates a
# "Version Packages" PR (bumps package.json, writes CHANGELOG.md). If that PR
# was just merged (no changesets pending, but the version differs from what's
# on npm), publishes to npm instead. Never both in the same run.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Trusted publishing needs a recent npm CLI (11.5.1+) to detect and use
      # the OIDC token — the version bundled with actions/setup-node may lag.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Create Release Pull Request or publish to npm
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

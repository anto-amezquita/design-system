name: Security review

# Claude reviews each PR's diff for exploitable vulnerabilities and comments
# inline. Runs once per PR (the action caches that it already reviewed it);
# push new commits and it won't re-run unless run-every-commit is set.
#
# Threat model: the action is not hardened against prompt injection, so it
# only runs on PRs from people with write access, never on forks or Dependabot
# (Dependabot runs get no secrets anyway). The job holds the Anthropic API key
# and comment rights, nothing that can push code or publish.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      # No release tags upstream, so pinned to a reviewed commit (main, 2026-02-11).
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          claude-model: claude-opus-5-5
          comment-pr: true
          exclude-directories: node_modules,.next,storybook-static,dist,coverage
          custom-security-scan-instructions: .github/security-review-instructions.txt

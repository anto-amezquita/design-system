name: Storybook on GitHub Pages

# Publishes the Storybook built from main to
# https://anto-amezquita.github.io/design-system/, an address that always
# shows main as it is. The docs site (design.amezquita.dk) links each
# component page to its first story there, using the registry's
# defaultStoryId.
#
# Why not Chromatic's own main-- address: chromatic.yml runs with
# onlyChanged, so a merge that changes no story is a skipped build, and a
# skipped build publishes no Storybook. That address can trail main by any
# number of merges (on 2026-10-05 it had no ThemeScope, a day after 1.3.0).
# Publishing every build there would cost a full set of snapshots per merge.
#
# Needs Pages enabled once, with "GitHub Actions" as its source (repo
# Settings → Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: storybook-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
